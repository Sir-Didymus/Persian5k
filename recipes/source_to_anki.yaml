- generate_guids_in_csvs:
    source:
    - src/data/Persian5k.csv
    columns:
    - guid
- build_parts:
  - note_models_from_yaml_part:
      part_id: Persian5k
      file: src/note_models/Persian5k/Persian5k.yaml
  - headers_from_yaml_part:
      part_id: deck_headers
      file: src/headers/header1.yaml
  - notes_from_csvs:
      part_id: deck_notes
      save_to_file: null
      file_mappings:
      - file: src/data/Persian5k.csv
        note_model: Persian5k
      note_model_mappings:
      - note_models:
        - Persian5k
        columns_to_fields:
          guid: guid
          id: id
          sort-index: sort-index
          frequency-rank: frequency-rank
          frequency: frequency
          part-of-speech: part-of-speech
          word: word
          word-romanization: word-romanization
          definition: definition
          sentence: sentence
          sentence-romanization: sentence-romanization
          sentence-meaning: sentence-meaning
          word-audio: word-audio
          sentence-audio: sentence-audio
          word-auido-source: word-auido-source
          sentence-auido-source: sentence-auido-source
          tags: tags
  - media_group_from_folder:
      part_id: deck_media
      source: src/media/
      recursive: true
- generate_crowd_anki:
    folder: build/Persian5k
    notes:
      part_id: deck_notes
    note_models:
      parts:
      - part_id: Persian5k
    headers: deck_headers
    media:
      parts:
      - deck_media
