<!-- Front html for the Persian5k note type - card "english-persian" -->

<div class="persian5k">
  <div class="persian5k-head">
    <div class="persian5k-part-of-speech">{{Part-of-Speech}}</div>
  </div>
  <div class="persian5k-body">
    <div class="persian5k-word hidden" dir="rtl">{{Word}}</div>
    <div class="persian5k-romanization hidden">{{Word-Romanization}}</div>
    <hr />
    <div class="persian5k-definition">{{Definition}}</div>
    <hr />
    <div class="persian5k-sentence persian5k-hide-target-word" dir="rtl">{{Sentence}}</div>
    <div class="persian5k-romanization hidden">{{Sentence-Romanization}}</div>
    <div class="persian5k-sentence-meaning">{{Sentence-Meaning}}</div>
  </div>
</div>
